name: Sync fork and build desktops

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

concurrency:
  group: fork-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    if: github.event.repository.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # Needed when upstream changes workflow files; no token is exposed to build jobs.
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
      - name: Merge upstream and dispatch a changed desktop build
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
        run: python3 .github/scripts/fork_build.py sync
